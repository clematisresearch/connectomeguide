<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Conn2026 Submission Flowchart</title>
  <desc id="desc">A flowchart showing the required submission deliverables for one-track and two-track participation options in the Conn2026 competition.</desc>
  <defs>
    <marker id="arrowHead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
      .boxTitle { font: 700 24px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 500 16px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .smallText { font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #475569; }
      .foot { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .panelSoft { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2.5; }
      .panelSoft2 { fill: #eff6ff; stroke: #0891b2; stroke-width: 2.5; }
      .diamondFill { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1200" fill="#ffffff"/>

  <text x="900" y="54" text-anchor="middle" class="title">Conn2026 Submission Flowchart</text>
  <text x="900" y="86" text-anchor="middle" class="subtitle">Choose the number of tracks, then follow the pathway that matches your participation goal.</text>

  <g filter="url(#shadow)">
    <rect x="700" y="120" rx="18" ry="18" width="400" height="80" class="panel"/>
  </g>
  <text x="900" y="154" text-anchor="middle" class="boxTitle">Start</text>
  <text x="900" y="180" text-anchor="middle" class="boxText">How many tracks are you submitting?</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M 900 200 L 900 242"/>

  <g filter="url(#shadow)">
    <polygon points="900,245 1075,335 900,425 725,335" class="diamondFill"/>
  </g>
  <text x="900" y="327" text-anchor="middle" class="boxTitle">1 track or 2 tracks?</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M 744 335 C 620 335, 520 380, 355 425"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M 1056 335 C 1180 335, 1280 380, 1445 425"/>

  <g filter="url(#shadow)">
    <rect x="120" y="425" rx="18" ry="18" width="470" height="95" class="panel"/>
  </g>
  <text x="355" y="459" text-anchor="middle" class="boxTitle">1 Track</text>
  <text x="355" y="486" text-anchor="middle" class="boxText">Participation certificate pathway</text>
  <text x="355" y="508" text-anchor="middle" class="smallText">One chosen track only</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M 355 520 L 355 555"/>

  <g filter="url(#shadow)">
    <rect x="120" y="555" rx="18" ry="18" width="470" height="95" class="panelSoft2"/>
  </g>
  <text x="355" y="589" text-anchor="middle" class="boxTitle">Participation</text>
  <text x="355" y="616" text-anchor="middle" class="boxText">At least one track submitted</text>
  <text x="355" y="638" text-anchor="middle" class="smallText">Participation certificate pathway</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M 355 650 L 355 705"/>

  <g filter="url(#shadow)">
    <rect x="80" y="710" rx="18" ry="18" width="550" height="165" class="panelSoft"/>
  </g>
  <text x="355" y="745" text-anchor="middle" class="boxTitle">Required deliverables</text>
  <text x="120" y="780" class="boxText">• 1 video submission via Discord</text>
  <text x="120" y="804" class="boxText">  for your chosen track</text>
  <text x="120" y="838" class="boxText">• 1 written report via Google Form</text>
  <text x="120" y="862" class="boxText">  for your chosen track</text>

  <g filter="url(#shadow)">
    <rect x="1180" y="425" rx="18" ry="18" width="500" height="95" class="panel"/>
  </g>
  <text x="1430" y="459" text-anchor="middle" class="boxTitle">2 Tracks</text>
  <text x="1430" y="486" text-anchor="middle" class="boxText">Choose your participation goal</text>
  <text x="1430" y="508" text-anchor="middle" class="smallText">Participation certificate or award consideration</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M 1430 520 L 1430 555"/>

  <g filter="url(#shadow)">
    <polygon points="1430,558 1605,648 1430,738 1255,648" class="diamondFill"/>
  </g>
  <text x="1430" y="640" text-anchor="middle" class="boxTitle">Participation or award?</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M 1302 656 C 1245 705, 1188 715, 1135 745"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M 1558 656 C 1610 705, 1650 715, 1690 745"/>

  <g filter="url(#shadow)">
    <rect x="990" y="745" rx="18" ry="18" width="290" height="100" class="panelSoft2"/>
  </g>
  <text x="1135" y="779" text-anchor="middle" class="boxTitle">Participation</text>
  <text x="1135" y="806" text-anchor="middle" class="boxText">Both tracks may be introductory</text>
  <text x="1135" y="830" text-anchor="middle" class="smallText">Participation certificate pathway</text>

  <g filter="url(#shadow)">
    <rect x="1370" y="745" rx="18" ry="18" width="290" height="100" class="panelSoft2"/>
  </g>
  <text x="1515" y="779" text-anchor="middle" class="boxTitle">Award</text>
  <text x="1515" y="806" text-anchor="middle" class="boxText">At least one advanced level</text>
  <text x="1515" y="830" text-anchor="middle" class="smallText">Both tracks required</text>

  <path class="arrow" marker-end="url(#arrowHead)" d="M 1135 845 L 1135 900"/>
  <path class="arrow" marker-end="url(#arrowHead)" d="M 1515 845 L 1515 900"/>

  <g filter="url(#shadow)">
    <rect x="900" y="905" rx="18" ry="18" width="900" height="170" class="panelSoft"/>
  </g>
  <text x="1350" y="940" text-anchor="middle" class="boxTitle">Required deliverables</text>
  <text x="930" y="975" class="boxText">Discord (Video): Either 1 combined video covering both tracks, or 2 separate videos, one for each track</text>
  <text x="930" y="1005" class="boxText">Google Form (Written): 2 separate written reports, one for each track</text>

  <text x="900" y="1100" text-anchor="middle" class="foot">For award consideration, participants must complete both tracks and at least one track at the Advanced Level.</text>
</svg>
